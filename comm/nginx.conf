user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections 768;
  # multi_accept on;
}

http {

  ##
  # Basic Settings
  ##

  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  server_tokens off;

  add_header X-Frame-Options "SAMEORIGIN";
  add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
  add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
  add_header X-XSS-Protection "0;";
  add_header Referrer-Policy "strict-origin";

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ##
  # SSL Settings
  ##

  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
  ssl_prefer_server_ciphers on;

  ##
  # Logging Settings
  ##

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  ##
  # Gzip Settings
  ##

  gzip on;

  ##
  # Virtual Host Configs
  ##

  upstream gpax {
    ip_hash;
    server gpax.com fail_timeout=20s;
    server gpaxalterno.com fail_timeout=20s;
  }
  map $http_upgrade $connection_upgrade {
    default Upgrade;
    '' close;
  }

  #
  server {

    gzip on;
    gzip_types      text/plain test/css application/json application/javascript;
    gzip_proxied    no-cache no-store private expired auth;
    gzip_min_length 1000;

    # Limite de tamaño de los archivos a adjuntar
    client_max_body_size 2000M;

    # Redirect all non-SSL traffic to SSL.
    if ($ssl_protocol = "") {
      rewrite ^ https://$host$request_uri? permanent;
    }

    root /root/dummy;

    server_name dominio.com;

    # Archivos estáticos del GPAX
    location / {
      proxy_buffers 10 32k;
      proxy_buffer_size 64k;
      proxy_pass https://gpax;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;
      proxy_set_header X-Client-Subject $ssl_client_s_dn;
    }
    # Autenticación federada con cuentas Microsoft
    location /auth {
      proxy_buffers 10 32k;
      proxy_buffer_size 64k;
      proxy_pass https://gpax;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;
      proxy_set_header X-Client-Subject $ssl_client_s_dn;
    }
    # Support for websocket
    location /socket.io {
      proxy_buffers 8 32k;
      proxy_buffer_size 64k;
      proxy_pass https://gpax;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 999999999;
    }
    # Filtro del módulo de comunicación
    location ~ \/api\/(note|comment|attached|commitment|evidence|user|document|plan|indicator|plan|params|notification|eventUtil|template) {
      proxy_buffers 10 32k;
      proxy_buffer_size 64k;
      proxy_pass https://gpax;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;
      proxy_set_header X-Client-Subject $ssl_client_s_dn;
    }

    location ~ /\.ht { 
      deny all;
    }
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

    location = /error.html {
      ssi on;
      internal;
      auth_basic off;
      root /var/www/html;
    }

    listen 443 ssl; 
    http2 on;
    ssl_certificate /root/ssl/fullchain.pem; 
    ssl_certificate_key /root/ssl/privkey.pem; 
    include /root/ssl/options-ssl-nginx.conf; 
    ssl_dhparam /root/ssl/ssl-dhparams.pem; 
  }
}
